# 毎日、本番の依存関係（推移的なものを含む）の脆弱性を調べる。Dependabot の補完（データベースの反映の遅れ、
# 修正版がまだないものを見逃さないため）。high 以上があれば失敗し、Issue を立てる（GitHub の通知メールが届く）。
name: Dependency audit

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 09:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: audit
        run: |
          set +e
          pnpm audit --prod --audit-level=high > audit.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt
      - name: Open an issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="依存関係に脆弱性があります（high 以上）"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            { echo '`pnpm audit --prod --audit-level=high` の結果です。Dependabot の PR が来ていなければ、手動で更新するか、メンテ中スイッチ（docs/deploy-runbook.md）を検討してください。'; echo; echo '```'; cat audit.txt; echo '```'; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
      - if: steps.audit.outputs.status != '0'
        run: exit 1
