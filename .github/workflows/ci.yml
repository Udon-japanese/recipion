# ゲート（check・typecheck・test・build）。PR と main への push で動き、
# 依存関係の自動マージ・自動デプロイからも workflow_call で呼ばれる。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      # Node.js と pnpm の版は mise.toml を正本にする（手元と同じ版を使う）。
      - uses: jdx/mise-action@v5.2.7
      - run: pnpm install --frozen-lockfile
      # ブラウザと、その動作に要る OS のパッケージ（apt）を入れる。実行環境が apt の配布元の名前を引けず、
      # 10分待って落ちることがある（GitHub 側の一時的な障害）。1回4分で打ち切り、30秒おいて最大3回試す。
      - name: Install Playwright browser
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 4m pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright の導入に失敗しました（${attempt}回目）"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
        env:
          # 失敗したときの DOM の出力が、既定（7,000 文字）では途中で切れて、原因が読めない。
          DEBUG_PRINT_LIMIT: "200000"
      # ビルドの後工程が vite preview を起動して静的ページを作る。DB には接続しない（Cookie なし）が、
      # 設定の読み込みに必要なので、ダミーの値を渡す（秘密の値は使わない）。
      - run: pnpm run build
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
          BETTER_AUTH_URL: http://localhost:4173
