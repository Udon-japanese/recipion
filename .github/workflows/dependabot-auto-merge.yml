# Dependabot の PR を、ゲート（CI）が通ったら自動でマージする。
# - major の更新は、自動ではマージしない（人が確認する）。
# - セキュリティ更新だったときだけ、マージのあと本番へ自動でデプロイする（deploy.yml）。
name: Dependabot auto merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

jobs:
  inspect:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      mergeable: ${{ steps.decide.outputs.mergeable }}
      security: ${{ steps.decide.outputs.security }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          # dependabot.yml の security グループは、セキュリティ更新だけを対象にしている（ghsa-id は、グループの PR では空になる）。
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # グループの PR では update-type が空になることがあるので、その場合は major の可能性を残して自動マージしない。
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
          else
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GHSA_ID" ] || [ "$DEPENDENCY_GROUP" = "security" ] || echo "$LABELS" | grep -q '"security"'; then
            echo "security=true" >> "$GITHUB_OUTPUT"
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: inspect
    if: needs.inspect.outputs.mergeable == 'true'
    uses: ./.github/workflows/ci.yml

  merge:
    needs: [inspect, gate]
    runs-on: ubuntu-latest
    steps:
      # ブランチ保護で必須にしている CI の gate（別のワークフロー）が終わる前にマージすると、
      # 「ブランチの規則で禁止されている」と断られる。必須のチェックが終わるのを待つ（失敗なら、ここで止まる）。
      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --required --watch --fail-fast
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
      - name: Deploy (security updates only)
        if: needs.inspect.outputs.security == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
