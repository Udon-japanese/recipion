# メンテ中スイッチ。Actions → Maintenance → Run workflow で、on / off を選ぶ。
# - on : アプリ全体を、メンテ中の画面（503）だけを返す Worker に差し替える。数十秒で反映される。
#        WAF で止めているパスは、これまでどおり WAF が止める。それ以外は、どのパスもメンテ中の画面になる。
# - off: ゲートを通して、通常のアプリをデプロイし直す。
# 手元からは `pnpm run maintenance:on` / `pnpm run maintenance:off`。
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: メンテ中にする（on）／終わらせる（off）
        type: choice
        options: [on, off]
        required: true

permissions:
  contents: read

jobs:
  on:
    if: inputs.mode == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run maintenance:on

  off:
    if: inputs.mode == 'off'
    uses: ./.github/workflows/deploy.yml
    with:
      force: true
    secrets: inherit
