allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - '@tanstack/history@1.162.4'
  - '@tanstack/router-cli@1.167.36'
  - '@tanstack/router-core@1.171.30'
  - '@tanstack/router-generator@1.167.36'
# drizzle-kit が使う古い @esbuild-kit が、脆弱な esbuild 0.18 を持ち込む（開発用ツールだけ。Dependabot のアラート）。修正版に差し替える。
# drizzle-kit が @esbuild-kit を使わなくなったら、この指定は外す。
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
# miniflare（wrangler・@cloudflare/vite-plugin の開発用サーバー）が、脆弱な undici 7.29.1 を固定で持ち込む（開発用ツールだけ。本番の Worker には入らない）。
# miniflare が 7.30.1 以上に上がったら、この指定は外す。
  miniflare>undici: 7.30.1
patchedDependencies:
  '@vanilla-extract/vite-plugin@5.2.6': patches/@vanilla-extract__vite-plugin@5.2.6.patch
