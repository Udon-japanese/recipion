<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>418 I'm a teapot</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff6d6;color:#4a3b1e;font:16px/1.5 system-ui,sans-serif;text-align:center}
h1{font-size:56px;margin:0}
p{margin:4px 0 12px}
#t{position:absolute;opacity:0}
label{display:block;width:260px;height:230px;margin:0 auto;position:relative;cursor:pointer}
label *{position:absolute;box-sizing:border-box}
.p{left:20px;top:40px;width:130px;height:110px;transition:transform .7s;transform-origin:50% 100%}
.b{inset:22px 0 0;background:#f4b942;border-radius:50% 50% 42% 42%}
.l{left:40px;top:6px;width:50px;height:22px;background:#e0a02c;border-radius:50% 50% 0 0}
.s{right:-30px;top:44px;width:44px;height:16px;background:#f4b942;border-radius:0 12px 12px 0;transform:rotate(-28deg)}
.h{left:-28px;top:44px;width:36px;height:46px;border:9px solid #f4b942;border-right:0;border-radius:24px 0 0 24px}
.w{left:184px;top:105px;width:6px;height:0;background:#6fb7e0;transition:height .35s .5s}
.c{left:150px;top:176px;width:60px;height:46px;background:#fff;border:3px solid #4a3b1e;border-radius:0 0 20px 20px}
.c:after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:#6fb7e0;border-radius:0 0 17px 17px;transition:height 1s 1s}
#t:checked~label .p{transform:rotate(22deg)}
#t:checked~label .w{height:70px}
#t:checked~label .c:after{height:30px}
#t:focus-visible~label{outline:3px solid #4a3b1e}
a{color:inherit}
@media(prefers-reduced-motion:reduce){*,:after{transition:none!important}}
</style>
<main>
<h1>418</h1>
<p>I'm a teapot. Click to pour tea.</p>
<input type=checkbox id=t aria-label="Pour tea">
<label for=t><i class=p><i class=b></i><i class=l></i><i class=s></i><i class=h></i></i><i class=w></i><i class=c></i></label>
<p><a href=/>recipion</a></p>
</main>
