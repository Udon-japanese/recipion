<!doctype html>
<html lang="ja">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>メンテナンス中 - {{APP_NAME}}</title>
        <style>
            html {
                background: #fffbea;
                color: #3b3226;
                font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                text-align: center;
                padding: 24px;
                box-sizing: border-box
            }
            main {
                width: 100%;
                max-width: 28rem
            }
            svg {
                display: block;
                width: 100%;
                max-width: 360px;
                height: auto;
                margin: 0 auto 20px;
                overflow: visible
            }
            .m {
                fill: #e9a900
            }
            .i {
                fill: #292720
            }
            .me {
                transform-origin: 112.5px 220px;
                animation: b 3.6s ease-in-out infinite
            }
            @keyframes b {
                50% {
                    transform: scale(1.025, 0.975)
                }
            }
            h1 {
                font-size: 1.4rem;
                margin: 0 0 12px
            }
            p {
                line-height: 1.8;
                margin: 0 0 8px
            }
            .reason {
                background: #fff;
                border-radius: 8px;
                padding: 8px 12px;
                margin: 25px 0
            }
            @media (prefers-reduced-motion: reduce) { .me { animation: none } }
        </style>
    </head>
    <body>
        <main>
            <svg viewbox="0 100 225 135" aria-hidden="true">
                <g class="me"><path class="m" d="M112.5 130c32.5 0 47.5 35 47.5 62 0 20-15 28-47.5 28S65 212 65 192c0-27 15-62 47.5-62Z"/><rect class="i" x="90" y="155" width="13" height="25" rx="6.5"/><rect class="i" x="122" y="155" width="13" height="25" rx="6.5"/></g>
            </svg>
            <h1>ただいまメンテナンス中です</h1>
            <p>ご不便をおかけします。<br>作業が終わりしだい、また使えるようになります。</p>{{REASON}}
            <p>しばらくしてから、もう一度開いてください。</p>
        </main>
    </body>
</html>
